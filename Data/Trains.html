<!doctype html>
<html lang="de">
<script src="logic.js"></script>
<script src="reusabel.js"></script>
<link rel="stylesheet" href="css/trainlist_style.css">
<link rel="stylesheet" href="css/header.css">

<head>
  <link rel="icon" type="image/x-icon" href="Images/train-svgrepo-com.png" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zugliste bearbeiten</title>
</head>

<body>
    <div id="HeaderMenu">
        <r-menu id="menu"></r-menu>
        <div id="Header">
          <button type="button" onclick="Menu('button')" id="MenuButton" name="menu">
          <img src="Images/menuIcon.svg" height="20px" width="20px" />
        </button>
        <h1>Platten Controller</h1>
      </div>
    </div>
    <div id="Error">
    <b id="ErrorText">Diese Seite ist auf Querformat ausgerichtet. </b>
    <b id="ErrorText">Bitte drehen Sie Ihr Gerät.</b>
  </div>
   <div id="edit" style="display: none; z-index: 2;">
    <form action="edit_train" id="edit_form">
      <div id="input">
      <label for="edit_id">ID:</label>
      <input type="text" class="edit_input" id="edit_id" name="edit_id" readonly></input>
      <label for="edit_type">Beschreibung:</label>
      <input type="text" class="edit_input" id="edit_type" name="edit_type"></input>
      <label for="edit_speed">Geschwindigkeit:</label>
      <input type="number" class="edit_input" id="edit_speed" name="edit_speed"></input>
      </div>
      <div id="edit_buttons">
      <button id="Cancel" class="edit_button" value="Abbrechen" onclick="off()">Abbrechen</button>
      <button id="Save" class="edit_button" name="Save" value="Speichern" onclick="save()">Speichern</button>
      <button id="Del" class="edit_button" name="Del" value="Löschen" onclick="Save()">Löschen</button>
      </div>
      <input type="checkbox" name="isAdd" id="isAdd" style="display: none;" checked=""></input>
    </form>
  </div>
  <!-- <div id="content" onclick="Menu('div')"> -->
  <div id="content">
  <div id="Table">
    <script>
      populateTrainList();
    </script>
    <table id='Trainlist'>
      <tr>
        <th>ID</th>
        <th>Type</th>
        <th>max_speed</th>
        <th>Functions</th>
      </tr>
    </table>
     <button id="add" value="add" onclick="add()">Hinzufügen</button>
  </div>
</div>

</body>

</html>
