<!doctype html>
<html lang="de">
  <head>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/header.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="Images/train-svgrepo-com.png" />

    <script src="logic.js"></script>
    <script src="reusabel.js"></script>
    <title>Platten Kontroller</title>
  </head>

  <body>
    <div id="overlay_add" style="display: none;">
      <input type="text" id="pin_input"></input>
      <div id="buttons">
        <button id="close_overlay" onclick="overlay('none')">Abbrechen</button>
        <button id="add_overlay" onclick="add_controlls()">Hinzufügen</button>
      </div>
    </div>
    <div id="HeaderMenu">
        <r-menu id="menu"></r-menu>
        <div id="Header">
          <button type="button" onclick="Menu('button')" id="MenuButton" name="menu">
          <img src="Images/menuIcon.svg" height="20px" width="20px" />
        </button>
        <h1>Platten Controller</h1>
      </div>
    </div>
    <button onclick="overlay('flex')" id="add">
      Hinzufügen
      <img src="Images/add-square-svgrepo-com.svg" height="15px" width="15px" />
    </button>
    <div id="content">
      <r-controlls></r-controlls>
    </div>
  </body>
</html>
