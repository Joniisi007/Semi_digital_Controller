<!doctype html>
<html lang="de">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="train-svgrepo-com.png" />

    <script src="logic.js"></script>
    <script src="reusabel.js"></script>
    <title>Platten Kontroller</title>
  </head>

  <body>
    <div id="overlay_add" style="display: none;">
      <input type="text" id="pin_input"></input>
      <div id="buttons">
        <button id="close_overlay" onclick="overlay('none')">Abbrechen</button>
        <button id="add_overlay" onclick="add_controlls()">Hinzufügen</button>
      </div>
    </div>
    <r-menu id="menu" style="display: none; visibility: hidden;"></r-menu>
    <div id="Header">
      <button type="button" onclick="Menu('button')" id="Menu" name="menu">
        <img src="menuIcon.svg" height="20px" width="20px" />
      </button>
      <h1>Platten Controller</h1>
    </div>
    <button onclick="overlay('flex')" id="add">
      Hinzufügen
      <img src="add-square-svgrepo-com.svg" height="15px" width="15px" />
    </button>
    <div id="content" onclick="Menu('div')">
      <r-controlls></r-controlls>
    </div>
  </body>
</html>
