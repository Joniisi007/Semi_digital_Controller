<!doctype html>
<html lang="de">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="train-svgrepo-com.png" />

    <script src="logic.js"></script>
    <script src="reusabel.js"></script>
    <title>Platten Kontroller</title>

  <body>

    <div id="MenuContent">

        <img src="close_icon.svg" height="25px" width="25px" />

      <form action="/">
        <button class="call_site">
          Home1
          <img src="arrow_right.svg" height="20px" width="20px" />

          <img src="arrow_right.svg" height="20px" width="20px" />
        </button>
      </form>
    </div>
    <div id="Header">
      <button type="button" onclick="Menu('button')" id="Menu" name="menu">
        <img src="menuIcon.svg" height="20px" width="20px" />
      </button>
      <h1>Platten Controller</h1>
    </div>
    <button onclick="add_controlls()" id="add">
      Hinzufügen
      <img src="add-square-svgrepo-com.svg" height="15px" width="15px" />
    </button>
    <div id="content" onclick="Menu('div')">
      <r-controlls></r-controlls>
